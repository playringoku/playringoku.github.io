<style>
/* Layout: daily header with day navigation, lives and timer, target-shaped board, number pad and actions; result card appears in flow at the end. */
:root {
  --bg: #F3F4F1; --paper: #FFFFFF; --tint: #EEF2EA; --ink: #1E2630; --muted: #5A6470; --line: #CDD3CB;
  --hi: #F6D27A; --nb: #BFD9F2; --accent: #2F6FB0; --bad: #B3261E; --badbg: #F9DEDC; --good: #2D7A4D; --goodbg: #E3F1E8;
  --hint: #9A6700; --whybg: #FCEFC7; --whyline: #C99A2E;
  --display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191D; --paper: #20262C; --tint: #2A3138; --ink: #E7EAE4; --muted: #9BA4AC; --line: #3A4249;
    --hi: #66501A; --nb: #23405C; --accent: #7DB3EA; --bad: #F07167; --badbg: #4A2422; --good: #5DBF85; --goodbg: #1E3328; --hint: #E3B341; --whybg: #4A3D1A; --whyline: #C99A2E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191D; --paper: #20262C; --tint: #2A3138; --ink: #E7EAE4; --muted: #9BA4AC; --line: #3A4249;
  --hi: #66501A; --nb: #23405C; --accent: #7DB3EA; --bad: #F07167; --badbg: #4A2422; --good: #5DBF85; --goodbg: #1E3328; --hint: #E3B341; --whybg: #4A3D1A; --whyline: #C99A2E; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top .tools { display: flex; gap: 8px; align-items: center; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 7vw, 42px); margin: 0; line-height: 1; letter-spacing: -.01em; }
.logo-o { display: inline-block; width: .62em; height: .62em; vertical-align: -.03em; margin: 0 .02em; }
.logo-o svg { width: 100%; height: 100%; display: block; }
.top button { padding: 8px 12px; font-size: 14px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; border-radius: 0; padding: 8px 10px; background: var(--paper); color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.day { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.day .mid { text-align: center; min-width: 0; }
.day .mid b { display: block; font-family: var(--display); font-weight: 500; font-size: 17px; }
.day .mid span { color: var(--muted); font-size: 14px; }
.day button { width: 44px; height: 44px; padding: 0; font-size: 20px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; font-weight: 700; margin-left: 6px; vertical-align: 1px; color: var(--ink); }
details { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 700; }
details ol { margin: 10px 0 4px; padding-left: 22px; display: grid; gap: 6px; }
details p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.bar b { color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 18px; justify-self: end; }
.lives { display: flex; gap: 4px; font-size: 22px; line-height: 1; }
.lives span { color: var(--bad); }
.lives span.lost { color: var(--line); }
.lives small { font-size: 14px; font-weight: 700; color: var(--muted); }
svg#board { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pad button { font-family: var(--display); font-size: 20px; padding: 12px 0; }
.pad button.used:disabled { opacity: .22; text-decoration: line-through; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, .pc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status { min-height: 46px; padding: 11px 14px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-weight: 700; }
.status.bad { border-color: var(--bad); color: var(--bad); }
.status.tip { border-color: var(--accent); color: var(--accent); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.result { background: var(--goodbg); border: 1px solid var(--good); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.result h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--good); }
.result.lost { background: var(--badbg); border-color: var(--bad); }
.result.lost h2 { color: var(--bad); }
.result.late { background: var(--whybg); border-color: var(--whyline); }
.result.late h2 { color: var(--hint); }
.rnote { margin: 0; font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.stats div { background: var(--paper); border-radius: 8px; padding: 8px 4px; }
.stats b { display: block; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.share { white-space: pre-line; background: var(--paper); border-radius: 8px; padding: 10px 12px; margin: 0; font-size: 15px; }
a.btn { display: inline-flex; align-items: center; font-weight: 700; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; }
a.btn:hover { border-color: var(--ink); }
a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pc { cursor: pointer; outline: none; }
.day { grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.day #today, .day #archbtn { width: auto; height: auto; padding: 8px 12px; font-size: 14px; }
.day .mid { text-align: left; }
h1 { white-space: nowrap; }
.archive { display: grid; gap: 12px; }
.archhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.archhead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.modes button { border: 0; border-radius: 0; padding: 10px 8px; background: var(--paper); color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.archlist { display: grid; gap: 8px; }
.archlist button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; text-align: left; font-weight: 500; }
.archlist .n { font-family: var(--display); font-weight: 700; min-width: 3.2em; }
.archlist .d { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.archlist .mark { width: 1.6em; text-align: center; }
.archlist .lv { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
.archlist .lv.easy { border-color: var(--good); color: var(--good); }
.archlist .lv.medium { border-color: var(--accent); color: var(--accent); }
.archlist .lv.hard { border-color: var(--hint); color: var(--hint); }
.archlist .lv.expert { border-color: var(--bad); color: var(--bad); }
.empty { color: var(--muted); }
.tut { position: fixed; inset: 0; background: rgba(15, 19, 23, .55); display: grid; place-items: center; padding: 16px; z-index: 10; overflow-y: auto; }
.tutbox:focus { outline: none; }
.tutbox { background: var(--bg); border-radius: 14px; padding: 18px 16px; width: 100%; max-width: 440px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.tuthead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
.tuthead button { padding: 6px 12px; font-size: 14px; }
.tutbox h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.25; }
.tutbox p { margin: 0; }
#tutBoard.big { max-width: 340px; }
#tutBoard .tp { cursor: pointer; }
#tutBoard { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }
#tutPad { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.status.good { border-color: var(--good); color: var(--good); }
</style>

<div class="wrap">
  <div class="top">
    <h1 aria-label="Ringoku">Ring<span class="logo-o"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31.5" fill="#1E2630"/><path d="M33.88 5.07 A27 27 0 0 1 54.38 16.90 L43.61 24.17 A14 14 0 0 0 32.98 18.03 Z" fill="#FFFFFF"/><path d="M56.27 20.16 A27 27 0 0 1 56.27 43.84 L44.58 38.14 A14 14 0 0 0 44.58 25.86 Z" fill="#F6D27A"/><path d="M54.38 47.10 A27 27 0 0 1 33.88 58.93 L32.98 45.97 A14 14 0 0 0 43.61 39.83 Z" fill="#FFFFFF"/><path d="M30.12 58.93 A27 27 0 0 1 9.62 47.10 L20.39 39.83 A14 14 0 0 0 31.02 45.97 Z" fill="#FFFFFF"/><path d="M7.73 43.84 A27 27 0 0 1 7.73 20.16 L19.42 25.86 A14 14 0 0 0 19.42 38.14 Z" fill="#FFFFFF"/><path d="M9.62 16.90 A27 27 0 0 1 30.12 5.07 L31.02 18.03 A14 14 0 0 0 20.39 24.17 Z" fill="#FFFFFF"/></svg></span>ku</h1>

<script>
// Anillos core: deterministic daily puzzle generator for Ringoku.
// Board: 4 rings x 8 pieces, offset like bricks. Each ring holds 1..8 once;
// touching pieces never hold the same number or consecutive numbers.
const AN = (function () {
  const N = 8, K = 4, C = N * K, FULL = 0x1FE;
  const cid = (k, i) => k * N + ((i % N) + N) % N;
  const NB = [], RING = [], RINGOF = [];
  for (let c = 0; c < C; c++) {
    const k = Math.floor(c / N), i = c % N, s = [];
    for (const [kk, ii] of [[k, i - 1], [k, i + 1], [k - 1, i], [k - 1, i + 1], [k + 1, i - 1], [k + 1, i]])
      if (kk >= 0 && kk < K) { const d = cid(kk, ii); if (!s.includes(d)) s.push(d); }
    NB.push(s); RINGOF.push(k);
  }
  for (let k = 0; k < K; k++) { const r = []; for (let i = 0; i < N; i++) r.push(cid(k, i)); RING.push(r); }

  const pc = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
  const bitval = m => 31 - Math.clz32(m);

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function assign(D, c0, v0) {
    const stack = [[c0, v0]];
    while (stack.length) {
      const [c, v] = stack.pop();
      if (!((D[c] >> v) & 1)) return false;
      D[c] = 1 << v;
      const bad = (1 << (v - 1)) | (1 << v) | (1 << (v + 1));
      for (const d of NB[c]) if (D[d] & bad) {
        D[d] &= ~bad;
        if (!D[d]) return false;
        if (pc(D[d]) === 1) stack.push([d, bitval(D[d])]);
      }
      for (const d of RING[RINGOF[c]]) if (d !== c && (D[d] >> v) & 1) {
        D[d] &= ~(1 << v);
        if (!D[d]) return false;
        if (pc(D[d]) === 1) stack.push([d, bitval(D[d])]);
      }
    }
    return true;
  }
  // Hidden singles inside each ring. Returns -1 contradiction, 0 no change, 1 changed.
  function hiddenPass(D) {
    let changed = 0;
    for (const ring of RING) for (let v = 1; v <= N; v++) {
      let where = -1, n = 0;
      for (const c of ring) if ((D[c] >> v) & 1) { n++; where = c; }
      if (!n) return -1;
      if (n === 1 && pc(D[where]) > 1) { if (!assign(D, where, v)) return -1; changed = 1; }
    }
    return changed;
  }
  function fullProp(D) { for (;;) { const r = hiddenPass(D); if (r < 0) return false; if (!r) return true; } }
  function pickCell(D) {
    let best = -1, bn = 99;
    for (let c = 0; c < C; c++) { const n = pc(D[c]); if (n > 1 && n < bn) { bn = n; best = c; } }
    return best;
  }
  function count(D0, limit) {
    const D = D0.slice();
    if (!fullProp(D)) return 0;
    const c = pickCell(D);
    if (c < 0) return 1;
    let tot = 0;
    for (let v = 1; v <= N && tot < limit; v++) if ((D[c] >> v) & 1) {
      const E = D.slice();
      if (assign(E, c, v)) tot += count(E, limit - tot);
    }
    return tot;
  }
  function shuffle(rng, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function randomSolution(rng) {
    function rec(D) {
      if (!fullProp(D)) return null;
      const c = pickCell(D);
      if (c < 0) return D;
      const vals = []; for (let v = 1; v <= N; v++) if ((D[c] >> v) & 1) vals.push(v);
      for (const v of shuffle(rng, vals)) { const E = D.slice(); if (assign(E, c, v)) { const r = rec(E); if (r) return r; } }
      return null;
    }
    const r = rec(new Array(C).fill(FULL));
    return r ? r.map(bitval) : null;
  }
  function startState(sol, giv) {
    const D = new Array(C).fill(FULL);
    for (const c of giv) if (!assign(D, c, sol[c])) return null;
    return D;
  }
  function makePuzzle(rng) {
    const sol = randomSolution(rng);
    const giv = new Set(Array.from({ length: C }, (_, i) => i));
    for (const c of shuffle(rng, Array.from({ length: C }, (_, i) => i))) {
      giv.delete(c);
      const D = startState(sol, giv);
      if (!(D && count(D, 2) === 1)) giv.add(c);
    }
    return { sol, giv: [...giv].sort((a, b) => a - b) };
  }

  // Smart hint: the next empty piece that can be deduced from what is already on the board.
  // known = indices of pieces whose value is known (givens + correct entries).
  // kind: 'direct' (forced by its neighbours and ring), 'ring' (only place left in its ring for a number),
  // 'unlock' (no simple deduction available: the piece that resolves the most others once revealed).
  // why: the visible pieces that force the answer (a small set, chosen greedily), so the game can show them.
  function hint(sol, known) {
    const knownSet = new Set(known);
    const empty = [];
    for (let c = 0; c < C; c++) if (!knownSet.has(c)) empty.push(c);
    if (!empty.length) return null;
    // First-order candidates: only what the visible numbers rule out (same ring, equal or consecutive neighbours).
    const cand = new Array(C).fill(0);
    for (const c of empty) {
      let m = FULL;
      for (const d of RING[RINGOF[c]]) if (knownSet.has(d)) m &= ~(1 << sol[d]);
      for (const d of NB[c]) if (knownSet.has(d)) m &= ~((1 << (sol[d] - 1)) | (1 << sol[d]) | (1 << (sol[d] + 1)));
      cand[c] = m & FULL;
    }
    const direct = empty.filter(c => pc(cand[c]) === 1);
    if (direct.length) { const c = direct[0]; return { cell: c, value: sol[c], kind: 'direct', why: whyDirect(sol, knownSet, c) }; }
    for (const ringCells of RING) for (let v = 1; v <= N; v++) {
      if (ringCells.some(d => knownSet.has(d) && sol[d] === v)) continue;
      const spots = ringCells.filter(d => !knownSet.has(d) && (cand[d] >> v) & 1);
      if (spots.length === 1) return { cell: spots[0], value: v, kind: 'ring', why: whyRing(sol, knownSet, ringCells, spots[0], v) };

  };
  let lang = store.get('lang');

  const st = { key: TODAY, p: null, val: {}, notes: {}, sel: null, noteMode: false,

  const known = () => st.p.giv.concat(Object.keys(st.val).map(Number));

  function track(path) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title: path, event: true }); } catch (e) {} }

  // Normal games are stored under the date; classic games (archive only) under "c:" + date.
  // archive: true marks a past puzzle played from the archive, which never counts for the streak.
  function save() {

  function renderLives() {
    const box = $('lives'); box.textContent = '';

    if (st.lost) { const m = document.createElement('small'); m.textContent = T().mistakesN(st.mistakes); box.appendChild(m); return; }   // no lives left: show the mistake count instead

  function draw() {

          'stroke-width': isSel || isWrong ? 4 : st.why.has(id) ? 3 : 1.2 }, g);

        else if (v) el('text', { x: m[0], y: m[1] + 10, 'text-anchor': 'middle', 'font-family': 'var(--display)', 'font-weight': given || st.hinted[id] ? 700 : 500, 'font-size': 28,

  // Numbers already in the selected piece's ring: the visible row of the ring, shown greyed out on the pad

  function ringUsed(id) {

  function renderResult() {

  // Show why a hint placed its number: the piece in yellow and the pieces that force it outlined in amber.
  // It stays until the player taps anywhere else.

    const v = st.val[id], sol = st.p.sol, sameRing = e => Math.floor(e / N) === Math.floor(id / N);

  // When a number is placed, tidy the notes it rules out (same ring; equal or consecutive neighbours).
  function tidyNotes(id, v) {

  const del = document.createElement('button'); del.id = 'del'; del.style.fontFamily = 'var(--body)'; del.style.fontSize = '13px'; del.style.lineHeight = '1.2';
  del.addEventListener('click', () => enter(0)); pad.appendChild(del);

  $('hintbtn').addEventListener('click', () => {
    if (over()) return;

    const h = AN.hint(st.p.sol, known());
    if (!h) return;
    st.hints++; st.sel = null;
    if (st.wrong && st.wrong.id === h.cell) st.wrong = null;
    st.hinted[h.cell] = { kind: h.kind, why: h.why || [] };   // kept so the player can tap it later to see why

  });

  function toggleLabels() {
    const t = T();
    $('notes').textContent = `${t.notes}: ${st.noteMode ? t.on : t.off}`;
    $('notes').classList.toggle('on', st.noteMode); $('notes').setAttribute('aria-pressed', String(st.noteMode));
  }
  $('notes').addEventListener('click', () => { st.noteMode = !st.noteMode; toggleLabels(); if (st.sel !== null) say(st.noteMode ? 'noteMode' : 'pick'); });
  function selectShare() { const r = document.createRange(); r.selectNodeContents($('shareText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  // Sharing: native share sheet on phones; WhatsApp and X links elsewhere; copy always available.
  const SITE = /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/index\.html$/, '') : 'https://playringoku.github.io/';
  const canNativeShare = !!navigator.share && window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const fullShare = () => $('shareText').textContent + '\n\n' + T().invite(SITE);
  function updateShare() {
    const text = fullShare();
    $('share').hidden = !canNativeShare;
    $('wa').hidden = canNativeShare; $('tw').hidden = canNativeShare;

  $('tw').addEventListener('click', () => track('compartir/x'));

    track('compartir/copiar');

  });
  $('reveal').addEventListener('click', () => { st.reveal = true; st.extra = false; save(); renderResult(); draw(); say('revealMsg'); });
  // "How to play" opens the interactive tutorial; the written rules stay in the "Rules" panel.
  $('helpbtn').addEventListener('click', () => openTut());
  $('today').addEventListener('click', () => load(TODAY));

  // Archive: every past puzzle, playable in normal or classic mode (never counts for the streak).
  let archMode = store.get('archmode') === 'classic' ? 'classic' : 'normal';
  function showArchive(open) {
    $('archive').hidden = !open; $('game').hidden = open; $('help').hidden = open;
    if (open) { renderArchive(); window.scrollTo(0, 0); }
  }
  function renderArchive() {
    const t = T(), list = $('archlist'); list.textContent = '';
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === archMode)));
    $('modeNote').textContent = archMode === 'classic' ? t.modeClassicNote : t.modeNormalNote;
    let any = false;
    for (let k = shiftKey(TODAY, -1); AN.parseKey(k) >= AN.LAUNCH; k = shiftKey(k, -1)) {
      any = true;
      const level = AN.levelOf(k), number = Math.round((AN.parseKey(k) - AN.LAUNCH) / 86400000) + 1;
      const s = store.get(archMode === 'classic' ? 'c:' + k : k) || {};
      const mark = s.solved ? '✅' : s.late ? '🟨' : s.lost ? '❌' : (s.val && Object.keys(s.val).length) ? '…' : '';
      const date = new Date(AN.parseKey(k)).toLocaleDateString(t.dateLocale, { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
      const b = document.createElement('button');
      b.innerHTML = `<span class="n"></span><span class="d"></span><span class="lv ${level}"></span><span class="mark"></span>`;
      b.querySelector('.n').textContent = t.number(number).replace('Ringoku ', '');
      b.querySelector('.d').textContent = date;
      b.querySelector('.lv').textContent = t[level];
      b.querySelector('.mark').textContent = mark;
      b.addEventListener('click', () => { showArchive(false); load(k, archMode === 'classic'); });
      list.appendChild(b);
    }
    if (!any) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = t.archEmpty; list.appendChild(p); }
  }
  $('archbtn').addEventListener('click', () => showArchive($('archive').hidden));
  $('archclose').addEventListener('click', () => { showArchive(false); if (st.key !== TODAY || st.classic) load(TODAY); });
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { archMode = b.dataset.mode; store.set('archmode', archMode); renderArchive(); }));

  function header() {
    const t = T(), p = st.p, key = st.key;
    const label = new Date(AN.parseKey(key)).toLocaleDateString(t.dateLocale, { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
    $('dtitle').textContent = t.number(p.number);
    $('dsub').textContent = key === TODAY ? t.today + label : label.charAt(0).toUpperCase() + label.slice(1);
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = t[p.level]; $('dsub').append(badge);
    if (st.classic) { const b2 = document.createElement('span'); b2.className = 'badge'; b2.textContent = t.classic; $('dsub').append(b2); }
    $('today').hidden = key === TODAY && !st.classic;
  }
  function applyLang() {
    const t = T();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
    $('del').textContent = t.del;
    svg.setAttribute('aria-label', t.board);
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    toggleLabels();
    if (!$('tut').hidden) renderTut();
    if (st.p) {
      header();
      if (over()) renderResult();
      if (!$('archive').hidden) renderArchive();
      const [k, a, kind] = st.msg; say(k, a, kind);
      draw();
    }
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('lang', lang); applyLang();
  }));

  function load(key, classic = false) {
    if (st.p && !over()) save();
    const p = AN.daily(key);
    const saved = store.get(classic ? 'c:' + key : key) || {};
    const val = {};
    // normal mode keeps only correct numbers; classic mode keeps whatever the player wrote
    for (const id in (saved.val || {})) if ((classic || saved.val[id] === p.sol[id]) && !p.giv.includes(+id)) val[id] = saved.val[id];
    const notes = {}; for (const id in (saved.notes || {})) notes[id] = new Set(saved.notes[id]);
    const hinted = {}; for (const id in (saved.hinted || {})) if (val[id] !== undefined) hinted[id] = saved.hinted[id];
    Object.assign(st, { key, p, val, notes, hinted, sel: null, focus: null, wrong: null, glow: null, why: new Set(),
      classic, archive: saved.archive !== undefined ? !!saved.archive : key !== TODAY && !saved.solved && !saved.lost,
      solved: !!saved.solved, lost: !!saved.lost, extra: !!saved.extra, late: !!saved.late, reveal: !!saved.reveal, firstEnd: false, mistakes: saved.mistakes || 0, hints: saved.hints || 0,
      ms: saved.ms || 0, since: Date.now() });
    header();
    $('result').hidden = true; $('playarea').hidden = false;
    $('timer').textContent = fmt(st.ms);
    say(Object.keys(st.val).length ? 'resume' : classic ? 'classicPick' : 'start');
    if (st.solved) end('win', false);
    else if (st.late) { end('late', false); say('lateMsg'); }
    else if (st.lost && st.extra && !st.reveal) { draw(); say('extraOn', null, 'bad'); }
    else if (st.lost) { end('lose', false); say(st.reveal ? 'revealMsg' : 'lostMsg', null, st.reveal ? undefined : 'bad'); }
    else draw();
  }

  document.addEventListener('visibilitychange', () => {
    if (over() || !st.p) return;
    if (document.hidden) { st.ms += Date.now() - st.since; save(); } else st.since = Date.now();
  });
  setInterval(() => { if (!over() && st.p) $('timer').textContent = fmt(elapsed()); }, 1000);

  // Tabs left open on a phone: when the date changes, move to the new puzzle
  // (straight away if the old one is finished or untouched; otherwise let the player finish and tell them).
  function checkNewDay() {
    const now = AN.keyOf(new Date());
    if (now === TODAY || !st.p) return;
    const wasToday = st.key === TODAY;
    TODAY = now;
    retention();
    const untouched = !Object.keys(st.val).length && !Object.keys(st.notes).length && !st.mistakes && !st.hints;
    if (wasToday && (over() || untouched)) { load(TODAY); say('newDay', null, 'tip'); return; }
    header();
    if (wasToday) say('newAvail', null, 'tip');
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
  window.addEventListener('focus', checkNewDay);
  window.addEventListener('pageshow', checkNewDay);
  setInterval(checkNewDay, 30000);

  // Retención anónima: sin cookies ni identificadores. El navegador solo guarda en qué días se abrió el puzzle
  // y avisa a GoatCounter una vez por hito: jugador nuevo, vuelve al día siguiente, y su 2.º, 3.º, 7.º, 14.º y 30.º día distinto.
  // Retención = retencion/dias-2 ÷ retencion/nuevo (y así con cada hito).
  function sendEvent(path, tries = 0) {
    if (window.goatcounter && window.goatcounter.count) { track(path); return; }
    if (tries < 20) setTimeout(() => sendEvent(path, tries + 1), 500);   // count.js se carga en async
  }
  function retention() {
    let days = store.get('days');
    if (!days) {   // primera vez con este código: recupera los días ya jugados antes, para no contar a los antiguos como nuevos
      days = [];
      for (let k = shiftKey(TODAY, -1); AN.parseKey(k) >= AN.LAUNCH; k = shiftKey(k, -1)) if (store.get(k)) days.unshift(k);
      store.set('daysCount', days.length);
      if (days.length) sendEvent('retencion/antiguo');
    }
    if (days.includes(TODAY)) return;
    const last = days[days.length - 1];
    days.push(TODAY); store.set('days', days.slice(-60));
    const n = (store.get('daysCount') || 0) + 1; store.set('daysCount', n);
    if (n === 1) sendEvent('retencion/nuevo');
    if (last === shiftKey(TODAY, -1)) sendEvent('retencion/vuelve-al-dia-siguiente');
    if ([2, 3, 7, 14, 30].includes(n)) sendEvent(`retencion/dias-${n}`);
  }

  // Tutorial: two tiny boards that teach the two rules by doing, then a nearly solved real board to finish.
  // Shown once to players who have never solved a puzzle; it can be reopened from "How to play".
  const TUT = [
    { ring: [1, 3, 5, 7, 2, 4, 6, 8], target: 5, answer: 4 },
    // three rings with real ids (0–23); the target sits in the middle ring, so all 6 neighbours show:
    // 15 and 9 beside it, 0 and 1 in the outer ring, 23 and 16 in the inner one.
    { cells: { 1: 3, 16: 6, 11: 8, 13: 7 }, target: 8, answer: 1, nb: NB[8] },
    // a real board (puzzle nº 1) with 3 gaps: pieces 1 and 5 share the outer ring (1 and 6 missing), so the
    // neighbours decide which goes where; piece 19 is alone in its ring.
    { board: [7,1,5,8,3,6,2,4,4,7,3,5,1,8,6,2,2,5,7,3,6,1,4,8,7,3,5,1,8,6,2,4], gaps: [1, 5, 19] },
  ];
  const tut = { step: 0, done: false, flash: null, sel: null, placed: {} };
  function sector(parent, r1, r0, th, attrs) {
    const P = (r, deg) => { const a = deg * Math.PI / 180; return [150 + r * Math.sin(a), 150 - r * Math.cos(a)]; };
    const a = P(r1, th - 22.5), b = P(r1, th + 22.5), c = P(r0, th + 22.5), d = P(r0, th - 22.5);
    el('path', { d: `M${a[0]} ${a[1]} A${r1} ${r1} 0 0 1 ${b[0]} ${b[1]} L${c[0]} ${c[1]} A${r0} ${r0} 0 0 0 ${d[0]} ${d[1]} Z`, ...attrs }, parent);
    return P((r0 + r1) / 2, th);
  }
  function tutText(parent, m, v, color) {
    el('text', { x: m[0], y: m[1] + 9, 'text-anchor': 'middle', 'font-family': 'var(--display)', 'font-weight': 700, 'font-size': 26, fill: color }, parent).textContent = v;
  }
  function drawTut() {
    const b = $('tutBoard'); b.textContent = '';
    const S = TUT[tut.step]; b.toggleAttribute('hidden', !S); if (!S) return;
    const piece = (id, r1, r0, th, v) => {
      const isT = id === S.target;
      const fill = isT ? 'var(--paper)' : tut.flash === id ? 'var(--badbg)' : S.nb && S.nb.includes(id) ? 'var(--nb)' : 'var(--tint)';
      const m = sector(b, r1, r0, th, { fill, stroke: isT && !tut.done ? 'var(--accent)' : tut.flash === id ? 'var(--bad)' : 'var(--ink)', 'stroke-width': isT && !tut.done || tut.flash === id ? 4 : 1.2 });
      const shown = isT && tut.done ? S.answer : v;
      if (shown) tutText(b, m, shown, isT ? 'var(--good)' : 'var(--ink)');
    };
    b.classList.toggle('big', !!S.board);
    if (S.board) {
      const W = 34, nb = new Set(tut.sel !== null && !tut.done ? NB[tut.sel] : []);
      for (let id = 0; id < C; id++) {
        const k = Math.floor(id / N), i = id % N, gap = S.gaps.includes(id), mine = tut.placed[id];
        const isSel = id === tut.sel && !tut.done;
        const fill = tut.flash === id ? 'var(--badbg)' : nb.has(id) ? 'var(--nb)' : gap && !mine ? 'var(--paper)' : k % 2 ? 'var(--tint)' : 'var(--paper)';
        const m = sector(b, 145 - k * W, 145 - (k + 1) * W, 45 * i + 22.5 * k, { fill,
          stroke: isSel ? 'var(--accent)' : tut.flash === id ? 'var(--bad)' : 'var(--ink)', 'stroke-width': isSel || tut.flash === id ? 3.5 : 1 });
        const v = gap ? mine || (tut.done ? 0 : '?') : S.board[id];
        if (v) el('text', { x: m[0], y: m[1] + 7, 'text-anchor': 'middle', 'font-family': 'var(--display)', 'font-weight': gap ? 700 : 500, 'font-size': k === 3 ? 15 : 19,
          fill: v === '?' ? 'var(--accent)' : gap ? 'var(--good)' : 'var(--ink)', 'pointer-events': 'none' }, b).textContent = v;
        if (gap && !mine && !tut.done) {
          const hit = b.querySelectorAll('path')[id];
          hit.setAttribute('class', 'tp');
          hit.addEventListener('click', () => { tut.sel = id; tut.flash = null; tut.msg = null; renderTut(); });
        }
      }
      return;
    }
    if (S.ring) S.ring.forEach((v, i) => piece(i, 145, 80, 45 * i, i === S.target ? 0 : v));
    else {
      for (let k = 0; k < 3; k++) for (let i = 0; i < 8; i++) piece(k * 8 + i, 145 - k * 40, 105 - k * 40, 45 * i + 22.5 * k, S.cells[k * 8 + i]);
    }
  }
  function renderTut() {
    const t = T(), S = TUT[tut.step], last = tut.step === TUT.length;
    $('tutStep').textContent = t.tutStepN(tut.step + 1, TUT.length + 1);
    $('tutTitle').textContent = t[`tut${tut.step + 1}Title`];
    $('tutText').textContent = t[`tut${tut.step + 1}Text`];
    $('tutPad').hidden = last; $('tutMsg').hidden = last;
    if (!tut.msg) { $('tutMsg').textContent = ''; $('tutMsg').className = 'status'; }
    else { const [k, a, kind] = tut.msg; $('tutMsg').textContent = typeof t[k] === 'function' ? t[k](a) : t[k]; $('tutMsg').className = 'status ' + kind; }
    const acts = $('tutActions'); acts.textContent = '';
    const btn = (label, primary, fn) => { const x = document.createElement('button'); x.textContent = label; if (primary) x.className = 'primary'; x.addEventListener('click', fn); acts.appendChild(x); return x; };
    if (!last && tut.done) btn(t.tutNext, true, () => { tut.step++; Object.assign(tut, { done: false, msg: null, flash: null, sel: null, placed: {} }); renderTut(); }).focus();
    if (last) btn(t.playToday, true, () => closeTut('fin')).focus();
    drawTut();
  }
  function tutPick(v) {
    const S = TUT[tut.step]; if (!S || tut.done) return;
    tut.flash = null;
    if (S.board) {
      if (tut.sel === null) { tut.msg = ['tut3Select', null, 'tip']; renderTut(); return; }
      const id = tut.sel, cur = c => S.gaps.includes(c) ? tut.placed[c] : S.board[c];
      if (v === S.board[id]) {
        tut.placed[id] = v; tut.sel = null;
        tut.done = S.gaps.every(c => tut.placed[c]);
        tut.msg = tut.done ? ['tut3Right', null, 'good'] : ['tut3Good', null, 'good'];
      } else {
        const k = Math.floor(id / N);
        const holder = [...Array(N).keys()].map(i => k * N + i).find(c => c !== id && cur(c) === v);
        const nb = NB[id].find(c => cur(c) && Math.abs(cur(c) - v) <= 1);
        if (holder !== undefined) { tut.flash = holder; tut.msg = ['tut2Ring', v, 'bad']; }
        else { tut.flash = nb; tut.msg = ['tut2Nb', cur(nb), 'bad']; }
      }
      renderTut(); return;
    }
    if (v === S.answer) { tut.done = true; tut.msg = [tut.step ? 'tut2Right' : 'tut1Right', null, 'good']; }
    else if (S.ring) { tut.flash = S.ring.indexOf(v); tut.msg = ['tut1Wrong', v, 'bad']; }
    else {
      const holder = +Object.keys(S.cells).find(id => S.cells[id] === v && !S.nb.includes(+id));
      const nb = S.nb.find(id => S.cells[id] && Math.abs(S.cells[id] - v) <= 1);
      if (nb !== undefined) { tut.flash = nb; tut.msg = ['tut2Nb', S.cells[nb], 'bad']; }
      else { tut.flash = holder; tut.msg = ['tut2Ring', v, 'bad']; }
    }
    renderTut();
  }
  for (let v = 1; v <= 8; v++) { const x = document.createElement('button'); x.textContent = v; x.addEventListener('click', () => tutPick(v)); $('tutPad').appendChild(x); }
  function openTut() {
    Object.assign(tut, { step: 0, done: false, msg: null, flash: null, sel: null, placed: {} });
    $('tut').hidden = false; renderTut(); track('tutorial/inicio');
    document.querySelector('.tutbox').focus();
  }
  function closeTut(how) {
    $('tut').hidden = true; store.set('tut', 1); track('tutorial/' + how);
  }
  $('tutSkip').addEventListener('click', () => closeTut('saltado'));
  $('tutOpen').addEventListener('click', openTut);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('tut').hidden) closeTut('saltado'); });

  const firstTime = !store.get('tut') && solvedCount() === 0;
  $('help').open = !store.get('help') && !firstTime;
  store.set('help', 1);
  applyLang();
  load(TODAY);
  retention();
  if (firstTime) openTut();
})();
</script>

</body>
</html>
