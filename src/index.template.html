<title>Ringoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script data-goatcounter="https://ringoku.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>
/* Layout: daily header with day navigation, lives and timer, target-shaped board, number pad and actions; result card appears in flow at the end. */
:root {
  --bg: #F3F4F1; --paper: #FFFFFF; --tint: #EEF2EA; --ink: #1E2630; --muted: #5A6470; --line: #CDD3CB;
  --hi: #F6D27A; --nb: #BFD9F2; --accent: #2F6FB0; --bad: #B3261E; --badbg: #F9DEDC; --good: #2D7A4D; --goodbg: #E3F1E8;
  --hint: #9A6700; --whybg: #FCEFC7; --whyline: #C99A2E;
  --display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191D; --paper: #20262C; --tint: #2A3138; --ink: #E7EAE4; --muted: #9BA4AC; --line: #3A4249;
    --hi: #66501A; --nb: #23405C; --accent: #7DB3EA; --bad: #F07167; --badbg: #4A2422; --good: #5DBF85; --goodbg: #1E3328; --hint: #E3B341; --whybg: #4A3D1A; --whyline: #C99A2E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191D; --paper: #20262C; --tint: #2A3138; --ink: #E7EAE4; --muted: #9BA4AC; --line: #3A4249;
  --hi: #66501A; --nb: #23405C; --accent: #7DB3EA; --bad: #F07167; --badbg: #4A2422; --good: #5DBF85; --goodbg: #1E3328; --hint: #E3B341; --whybg: #4A3D1A; --whyline: #C99A2E; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top .tools { display: flex; gap: 8px; align-items: center; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 7vw, 42px); margin: 0; line-height: 1; letter-spacing: -.01em; }
.logo-o { display: inline-block; width: .62em; height: .62em; vertical-align: -.03em; margin: 0 .02em; }
.logo-o svg { width: 100%; height: 100%; display: block; }
.top button { padding: 8px 12px; font-size: 14px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; border-radius: 0; padding: 8px 10px; background: var(--paper); color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.day { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.day .mid { text-align: center; min-width: 0; }
.day .mid b { display: block; font-family: var(--display); font-weight: 500; font-size: 17px; }
.day .mid span { color: var(--muted); font-size: 14px; }
.day button { width: 44px; height: 44px; padding: 0; font-size: 20px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; font-weight: 700; margin-left: 6px; vertical-align: 1px; color: var(--ink); }
details { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 700; }
details ol { margin: 10px 0 4px; padding-left: 22px; display: grid; gap: 6px; }
details p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.bar b { color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 18px; justify-self: end; }
.lives { display: flex; gap: 4px; font-size: 22px; line-height: 1; }
.lives span { color: var(--bad); }
.lives span.lost { color: var(--line); }
svg#board { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pad button { font-family: var(--display); font-size: 20px; padding: 12px 0; }
.pad button.used:disabled { opacity: .22; text-decoration: line-through; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, .pc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status { min-height: 46px; padding: 11px 14px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-weight: 700; }
.status.bad { border-color: var(--bad); color: var(--bad); }
.status.tip { border-color: var(--accent); color: var(--accent); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.result { background: var(--goodbg); border: 1px solid var(--good); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.result h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--good); }
.result.lost { background: var(--badbg); border-color: var(--bad); }
.result.lost h2 { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.stats div { background: var(--paper); border-radius: 8px; padding: 8px 4px; }
.stats b { display: block; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.share { white-space: pre-line; background: var(--paper); border-radius: 8px; padding: 10px 12px; margin: 0; font-size: 15px; }
a.btn { display: inline-flex; align-items: center; font-weight: 700; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; }
a.btn:hover { border-color: var(--ink); }
a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pc { cursor: pointer; outline: none; }
</style>

<div class="wrap">
  <div class="top">
    <h1 aria-label="Ringoku">Ring<span class="logo-o"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31.5" fill="#1E2630"/><path d="M33.88 5.07 A27 27 0 0 1 54.38 16.90 L43.61 24.17 A14 14 0 0 0 32.98 18.03 Z" fill="#FFFFFF"/><path d="M56.27 20.16 A27 27 0 0 1 56.27 43.84 L44.58 38.14 A14 14 0 0 0 44.58 25.86 Z" fill="#F6D27A"/><path d="M54.38 47.10 A27 27 0 0 1 33.88 58.93 L32.98 45.97 A14 14 0 0 0 43.61 39.83 Z" fill="#FFFFFF"/><path d="M30.12 58.93 A27 27 0 0 1 9.62 47.10 L20.39 39.83 A14 14 0 0 0 31.02 45.97 Z" fill="#FFFFFF"/><path d="M7.73 43.84 A27 27 0 0 1 7.73 20.16 L19.42 25.86 A14 14 0 0 0 19.42 38.14 Z" fill="#FFFFFF"/><path d="M9.62 16.90 A27 27 0 0 1 30.12 5.07 L31.02 18.03 A14 14 0 0 0 20.39 24.17 Z" fill="#FFFFFF"/></svg></span>ku</h1>
    <div class="tools">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button id="lang-es" data-lang="es">ES</button>
        <button id="lang-en" data-lang="en">EN</button>
      </div>
      <button id="helpbtn" aria-controls="help" data-t="howto"></button>
    </div>
  </div>

  <details id="help">
    <summary data-t="rules"></summary>
    <ol>
      <li data-t="r1"></li>
      <li data-t="r2"></li>
      <li data-t="r3"></li>
    </ol>
    <p data-t="rhelp"></p>
  </details>

  <div class="day">
    <button id="prev">‹</button>
    <div class="mid"><b id="dtitle"></b><span id="dsub"></span></div>
    <button id="next">›</button>
  </div>

  <div class="bar"><span id="progress"></span><div class="lives" id="lives" role="img"></div><b id="timer">0:00</b></div>
  <svg id="board" viewBox="0 0 600 600" role="group"></svg>

  <section class="result" id="result" hidden aria-live="polite">
    <h2 id="rtitle"></h2>
    <div class="stats">
      <div><b id="sTime">0:00</b><span data-t="sTime"></span></div>
      <div><b id="sStreak">0</b><span data-t="sStreak"></span></div>
      <div><b id="sSolved">0</b><span data-t="sSolved"></span></div>
    </div>
    <p class="share" id="shareText"></p>
    <div class="row">
      <button class="primary" id="share" data-t="shareBtn" hidden></button>
      <a class="btn" id="wa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn" id="tw" target="_blank" rel="noopener">X</a>
      <button id="copy" data-t="copy"></button>
      <span class="hint" id="copied" role="status"></span>
    </div>
  </section>

  <div id="playarea" style="display:grid;gap:14px">
    <div class="pad" id="pad"></div>
    <div class="row">
      <button id="notes" aria-pressed="false"></button>
      <button id="hintbtn"></button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
/*CORE*/

(function () {
  const { N, K, C, NB } = AN;
  const MAX_HINTS = 3;
  // 3 lives on easy and medium days, 5 on hard and very hard days (Fri–Sun), where a slip is more likely.
  const LIVES = () => (st.p && (st.p.level === 'hard' || st.p.level === 'expert')) ? 5 : 3;
  const NS = 'http://www.w3.org/2000/svg', CX = 300, CY = 300, R = 290, WD = 59;
  const $ = id => document.getElementById(id);
  const svg = $('board'), statusEl = $('status');
  let TODAY = AN.keyOf(new Date());   // updated by checkNewDay() if the tab stays open past midnight
  // v2: the rule changed on 13 Oct 2026, so progress saved for the old puzzles is not reused.
  // Language and help preferences carry over from v1.
  const store = {
    get(k) { try { const v = localStorage.getItem('anillos:v2:' + k) ?? (k === 'lang' || k === 'help' ? localStorage.getItem('anillos:v1:' + k) : null); return JSON.parse(v); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('anillos:v2:' + k, JSON.stringify(v)); } catch (e) {} },
  };

  const I18N = {
    es: {
      howto: 'Cómo se juega', rules: 'Reglas',
      r1: 'Cada anillo lleva los números del 1 al 8, sin repetir.',
      r2: 'Dos trozos que se tocan nunca llevan el mismo número ni números seguidos: un 4 no puede tocar ni un 3, ni un 4, ni un 5.',
      r3: 'Tienes 3 vidas (5 los viernes, sábados y domingos): cada número equivocado resta una. Las notas no cuentan.',
      rhelp: 'Cada trozo toca a los 2 de sus lados y a 2 en cada anillo vecino: 6 en los anillos centrales y 4 en el exterior y el interior. Al tocar un trozo se resaltan en azul los que toca y en el teclado se tachan los números que ya están en su anillo. Usa Notas para apuntar posibilidades. Si te atascas, Pista te muestra el siguiente trozo que se puede deducir y marca en amarillo los trozos en que se basa (3 por puzzle). Los números puestos por una pista quedan en color mostaza: tócalos para volver a ver por qué. Hay un puzzle nuevo cada día: fácil el lunes y cada vez más difícil hasta el domingo.',
      prev: 'Día anterior', next: 'Día siguiente', board: 'Tablero circular',
      number: n => `Ringoku nº ${n}`, today: 'Hoy, ', dateLocale: 'es-ES',
      easy: 'Fácil', medium: 'Medio', hard: 'Difícil', expert: 'Muy difícil',
      left: n => `Faltan ${n} trozos`, completed: 'Completado', lostShort: 'Sin vidas',
      lives: n => n === 1 ? 'Queda 1 vida' : `Quedan ${n} vidas`,
      solved: '¡Resuelto!', perfect: '¡Perfecto!', already: 'Ya lo resolviste', lostTitle: 'Sin vidas',
      sTime: 'Tiempo', sStreak: 'Racha de días', sSolved: 'Resueltos',
      shareBtn: 'Compartir', copy: 'Copiar', copied: 'Copiado', copyFail: 'Selecciona el texto y cópialo',
      invite: url => `¿Te atreves? Juega gratis: ${url}`,
      shareWin: (n, lvl, t, left, h, perfect, s, tot) => `Ringoku nº ${n} · ${lvl}\n✅ Resuelto en ${t} · vidas ${left}/${tot} · pistas ${h}${perfect ? ' · ¡Perfecto!' : ''}` + (s > 1 ? `\nRacha: ${s} días` : ''),
      shareLost: (n, lvl) => `Ringoku nº ${n} · ${lvl}\n❌ No lo he conseguido: me quedé sin vidas`,
      notes: 'Notas', on: 'sí', off: 'no', del: 'Borrar notas',
      hintBtn: n => `Pista (${n})`,
      filled: 'Este trozo ya está completo. En azul, los trozos que toca.',
      start: 'Toca un trozo vacío y elige un número.', resume: 'Seguimos donde lo dejaste.',
      pick: 'Elige un número para ese trozo.', noteMode: 'Modo notas: toca números para apuntar o quitar posibilidades.',
      selectFirst: 'Primero toca un trozo vacío.', good: 'Bien.',
      wrongNum: n => n === 1 ? 'Ese número no va ahí. Te queda 1 vida.' : `Ese número no va ahí. Te quedan ${n} vidas.`,
      // parts: for 'direct', one entry per yellow piece {n, rel, out}; for 'ring', the yellow pieces' numbers.
      hintMsg: ({ v, kind, parts }) => {
        const list = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1] : String(a[0]);
        const rel = { ring: 'de su anillo', nb: 'vecino', both: 'vecino y de su anillo' };
        if (kind === 'unlock') return `Pista: aquí va un ${v}. Con él se desbloquean varios trozos.`;
        if (kind === 'ring') return `Pista: en este anillo, el ${v} solo cabe aquí. En los demás huecos lo impide${parts.length > 1 ? 'n' : ''} ${list(parts.map(n => 'el ' + n))}, que los toca${parts.length > 1 ? 'n' : ''}.`;
        const ring = parts.filter(x => x.rel === 'ring').map(x => x.n).sort((a, b) => a - b).map(n => 'el ' + n);
        return `Pista: aquí solo cabe un ${v}. ` + parts.filter(x => x.rel !== 'ring').map(x => `El ${x.n} (${rel[x.rel]}) quita el ${list(x.out)}.`).join(' ') + (ring.length ? ` Su anillo ya tiene ${list(ring)}.` : '');
      },
      noHints: 'Ya has usado las 3 pistas.',
      inRing: 'Ese número ya está en este aro.',
      lostMsg: 'Te has quedado sin vidas. Mañana hay otro puzzle.',
      newDay: 'Ha empezado un nuevo día: aquí tienes el puzzle de hoy.',
      newAvail: 'Ya hay puzzle nuevo de hoy. Cuando acabes este, pulsa › para jugarlo.',
      fixed: v => `Número fijo ${v}`, yours: v => `Tu número ${v}`, empty: 'Trozo vacío',
    },
    en: {
      howto: 'How to play', rules: 'Rules',
      r1: 'Each ring holds the numbers 1 to 8, with no repeats.',
      r2: 'Two touching pieces never hold the same or consecutive numbers: a 4 can’t touch a 3, a 4 or a 5.',
      r3: 'You have 3 lives (5 on Friday, Saturday and Sunday): each wrong number costs one. Notes don’t count.',
      rhelp: 'Each piece touches the 2 beside it and 2 in each neighbouring ring: 6 in the middle rings, 4 in the outer and inner rings. Tapping a piece highlights the pieces it touches in blue and crosses out on the keypad the numbers already in its ring. Use Notes to pencil in candidates. If you get stuck, Hint fills in the next piece that can be deduced and outlines in yellow the pieces it relies on (3 per puzzle). Numbers placed by a hint stay mustard-coloured: tap them to see why again. A new puzzle every day: easy on Monday and harder each day until Sunday.',
      prev: 'Previous day', next: 'Next day', board: 'Circular board',
      number: n => `Ringoku #${n}`, today: 'Today, ', dateLocale: 'en-GB',
      easy: 'Easy', medium: 'Medium', hard: 'Hard', expert: 'Expert',
      left: n => `${n} pieces left`, completed: 'Completed', lostShort: 'Out of lives',
      lives: n => n === 1 ? '1 life left' : `${n} lives left`,
      solved: 'Solved!', perfect: 'Perfect!', already: 'Already solved', lostTitle: 'Out of lives',
      sTime: 'Time', sStreak: 'Day streak', sSolved: 'Solved',
      shareBtn: 'Share', copy: 'Copy', copied: 'Copied', copyFail: 'Select the text and copy it',
      invite: url => `Can you beat it? Play free: ${url}`,
      shareWin: (n, lvl, t, left, h, perfect, s, tot) => `Ringoku #${n} · ${lvl}\n✅ Solved in ${t} · lives ${left}/${tot} · hints ${h}${perfect ? ' · Perfect!' : ''}` + (s > 1 ? `\nStreak: ${s} days` : ''),
      shareLost: (n, lvl) => `Ringoku #${n} · ${lvl}\n❌ I didn’t make it: out of lives`,
      notes: 'Notes', on: 'on', off: 'off', del: 'Clear notes',
      hintBtn: n => `Hint (${n})`,
      filled: 'This piece is already done. The pieces it touches are in blue.',
      start: 'Tap an empty piece and pick a number.', resume: 'Picking up where you left off.',
      pick: 'Pick a number for that piece.', noteMode: 'Notes mode: tap numbers to add or remove candidates.',
      selectFirst: 'Tap an empty piece first.', good: 'Good.',
      wrongNum: n => n === 1 ? 'That number doesn’t go there. 1 life left.' : `That number doesn’t go there. ${n} lives left.`,
      hintMsg: ({ v, kind, parts }) => {
        const list = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : String(a[0]);
        const rel = { ring: 'same ring', nb: 'neighbour', both: 'neighbour, same ring' };
        if (kind === 'unlock') return `Hint: a ${v} goes here. It unlocks several pieces.`;
        if (kind === 'ring') return `Hint: in this ring, the ${v} only fits here. In the other gaps it is blocked by ${list(parts.map(n => 'the ' + n))}, which touch${parts.length > 1 ? '' : 'es'} them.`;
        const ring = parts.filter(x => x.rel === 'ring').map(x => x.n).sort((a, b) => a - b).map(n => 'the ' + n);
        return `Hint: only a ${v} fits here. ` + parts.filter(x => x.rel !== 'ring').map(x => `The ${x.n} (${rel[x.rel]}) rules out ${list(x.out)}.`).join(' ') + (ring.length ? ` Its ring already has ${list(ring)}.` : '');
      },
      noHints: 'You’ve used all 3 hints.',
      inRing: 'That number is already in this ring.',
      lostMsg: 'You’re out of lives. There’s a new puzzle tomorrow.',
      newDay: 'A new day has started: here’s today’s puzzle.',
      newAvail: 'Today’s new puzzle is out. When you finish this one, tap › to play it.',
      fixed: v => `Given number ${v}`, yours: v => `Your number ${v}`, empty: 'Empty piece',
    },
  };
  let lang = store.get('lang');
  if (lang !== 'es' && lang !== 'en') {
    const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
    lang = String(prefs[0]).toLowerCase().startsWith('es') ? 'es' : 'en';
  }
  const T = () => I18N[lang];

  const st = { key: TODAY, p: null, val: {}, notes: {}, sel: null, noteMode: false,
    solved: false, lost: false, firstEnd: false, mistakes: 0, hints: 0, wrong: null, glow: null, why: new Set(), hinted: {}, ms: 0, since: Date.now(), msg: ['start'] };

  const cid = (k, i) => k * N + ((i % N) + N) % N;
  function el(tag, a, parent) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return [CX + r * Math.sin(a), CY - r * Math.cos(a)]; };
  const fmt = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const over = () => st.solved || st.lost;
  function say(key, arg, kind) {
    st.msg = [key, arg, kind];
    const v = T()[key];
    statusEl.textContent = typeof v === 'function' ? v(arg) : v;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }
  const elapsed = () => st.ms + (over() || document.hidden ? 0 : Date.now() - st.since);
  const known = () => st.p.giv.concat(Object.keys(st.val).map(Number));
  function value(id) { return st.p.giv.includes(id) ? st.p.sol[id] : st.val[id]; }
  function track(path) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title: path, event: true }); } catch (e) {} }

  function save() {
    const notes = {}; for (const id in st.notes) notes[id] = [...st.notes[id]];
    store.set(st.key, { val: st.val, notes, hinted: st.hinted, solved: st.solved, lost: st.lost, mistakes: st.mistakes, hints: st.hints, ms: elapsed() });
  }
  function shiftKey(key, d) { return new Date(AN.parseKey(key) + d * 86400000).toISOString().slice(0, 10); }
  function streak() {
    let n = 0, k = TODAY;
    const t = store.get(TODAY);
    if (!(t && t.solved)) k = shiftKey(TODAY, -1);
    while (AN.parseKey(k) >= AN.LAUNCH) { const s = store.get(k); if (s && s.solved) { n++; k = shiftKey(k, -1); } else break; }
    return n;
  }
  function solvedCount() {
    let n = 0;
    for (let k = TODAY; AN.parseKey(k) >= AN.LAUNCH; k = shiftKey(k, -1)) { const s = store.get(k); if (s && s.solved) n++; }
    return n;
  }

  function renderLives() {
    const box = $('lives'); box.textContent = '';
    const left = LIVES() - st.mistakes;
    for (let i = 0; i < LIVES(); i++) { const s = document.createElement('span'); s.textContent = i < left ? '♥' : '♡'; if (i >= left) s.className = 'lost'; box.appendChild(s); }
    box.setAttribute('aria-label', T().lives(left));
  }

  function draw() {
    const p = st.p, giv = new Set(p.giv), t = T();
    const hiNb = new Set(st.sel !== null && !over() ? NB[st.sel] : []);
    svg.textContent = '';
    for (let k = 0; k < K; k++) {
      const r1 = R - k * WD, r0 = r1 - WD;
      for (let i = 0; i < N; i++) {
        const id = k * N + i, th = 45 * i + 22.5 * k;
        const a = pt(r1, th - 22.5), b = pt(r1, th + 22.5), c = pt(r0, th + 22.5), d = pt(r0, th - 22.5);
        const given = giv.has(id), placed = st.val[id] !== undefined;
        let fill = k % 2 ? 'var(--tint)' : 'var(--paper)';
        const isWrong = st.wrong && st.wrong.id === id && !over();
        if (isWrong) fill = 'var(--badbg)';
        else if (st.glow === id) fill = 'var(--hi)';
        else if (st.why.has(id)) fill = 'var(--whybg)';
        else if (hiNb.has(id)) fill = 'var(--nb)';
        const g = el('g', { 'data-id': id }, svg);
        if (!over()) { g.setAttribute('class', 'pc'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); }
        g.setAttribute('aria-label', given ? t.fixed(p.sol[id]) : placed ? t.yours(st.val[id]) : t.empty);
        const isSel = st.sel === id && !over();
        el('path', { d: `M${a[0]} ${a[1]} A${r1} ${r1} 0 0 1 ${b[0]} ${b[1]} L${c[0]} ${c[1]} A${r0} ${r0} 0 0 0 ${d[0]} ${d[1]} Z`,
          fill, stroke: isWrong ? 'var(--bad)' : isSel ? 'var(--accent)' : st.why.has(id) ? 'var(--whyline)' : 'var(--ink)',
          'stroke-width': isSel || isWrong ? 4 : st.why.has(id) ? 3 : 1.2 }, g);
        const m = pt((r0 + r1) / 2, th);
        const v = value(id) || (st.lost ? p.sol[id] : 0);
        if (isWrong) el('text', { x: m[0], y: m[1] + 10, 'text-anchor': 'middle', 'font-family': 'var(--display)', 'font-weight': 700, 'font-size': 28,
          fill: 'var(--bad)', 'text-decoration': 'line-through', 'pointer-events': 'none' }, g).textContent = st.wrong.n;
        else if (v) el('text', { x: m[0], y: m[1] + 10, 'text-anchor': 'middle', 'font-family': 'var(--display)', 'font-weight': given || st.hinted[id] ? 700 : 500, 'font-size': 28,
          fill: given ? 'var(--ink)' : st.hinted[id] ? 'var(--hint)' : value(id) ? 'var(--accent)' : 'var(--muted)', 'pointer-events': 'none' }, g).textContent = v;
        else if (st.notes[id] && st.notes[id].size) {
          const arr = [...st.notes[id]].sort(), lines = arr.length > 4 ? [arr.slice(0, 4), arr.slice(4)] : [arr];
          const tx = el('text', { x: m[0], y: m[1] + (lines.length > 1 ? -4 : 6), 'text-anchor': 'middle', 'font-family': 'var(--body)', 'font-weight': 700, 'font-size': 18, 'letter-spacing': 1, fill: 'var(--muted)', 'pointer-events': 'none' }, g);
          lines.forEach((ln, j) => { const ts = el('tspan', { x: m[0], dy: j ? 19 : 0 }, tx); ts.textContent = ln.join(''); });
        }
      }
    }
    const left = C - p.giv.length - Object.keys(st.val).length;
    $('progress').textContent = st.solved ? t.completed : st.lost ? t.lostShort : t.left(left);
    renderLives();
    renderPad();
    const hb = $('hintbtn'); hb.textContent = t.hintBtn(MAX_HINTS - st.hints); hb.disabled = st.hints >= MAX_HINTS;
  }

  // Numbers already in the selected piece's ring: the visible row of the ring, shown greyed out on the pad
  // so players don't have to scan the whole circle. Neighbours are not used (that would be a hint).
  function ringUsed(id) {
    const used = new Set(), k = Math.floor(id / N);
    for (let i = 0; i < N; i++) { const d = cid(k, i); const v = value(d); if (v && d !== id) used.add(v); }
    return used;
  }
  function renderPad() {
    const id = st.sel, empty = id !== null && !st.p.giv.includes(id) && st.val[id] === undefined;
    const used = empty ? ringUsed(id) : new Set();
    [...$('pad').querySelectorAll('button')].slice(0, 8).forEach((b, i) => {
      const u = used.has(i + 1); b.disabled = u; b.classList.toggle('used', u);
    });
  }

  function renderResult() {
    const t = T(), s = streak(), lvl = t[st.p.level], box = $('result');
    box.classList.toggle('lost', st.lost);
    $('sTime').textContent = fmt(st.ms); $('sStreak').textContent = s; $('sSolved').textContent = solvedCount();
    if (st.lost) {
      $('rtitle').textContent = t.lostTitle;
      $('shareText').textContent = t.shareLost(st.p.number, lvl);
    } else {
      const perfect = st.mistakes === 0 && st.hints === 0;
      $('rtitle').textContent = !st.firstEnd ? t.already : perfect ? t.perfect : t.solved;
      $('shareText').textContent = t.shareWin(st.p.number, lvl, fmt(st.ms), LIVES() - st.mistakes, st.hints, perfect, s, LIVES());
    }
    updateShare();
  }
  function end(kind, firstTime) {
    if (firstTime) {
      st.ms = elapsed();
      track(`${kind === 'win' ? 'resuelto' : 'perdido'}/${st.p.level}`);
    }
    if (kind === 'win') st.solved = true; else st.lost = true;
    st.firstEnd = firstTime; st.sel = null; st.wrong = null; st.glow = null; st.why = new Set(); save();
    $('playarea').hidden = true;
    $('result').hidden = false;
    $('timer').textContent = fmt(st.ms);
    renderResult();
    draw();
  }

  // Show why a hint placed its number: the piece in yellow and the pieces that force it outlined in amber.
  // It stays until the player taps anywhere else.
  function showHint(id) {
    const h = st.hinted[id];
    st.sel = null; st.glow = id; st.why = new Set(h.why || []); draw();
    const v = st.val[id], sol = st.p.sol, sameRing = e => Math.floor(e / N) === Math.floor(id / N);
    const parts = h.kind === 'ring' ? (h.why || []).map(e => sol[e])
      : (h.why || []).map(e => {
          const nb = NB[id].includes(e), out = new Set(sameRing(e) ? [sol[e]] : []);
          if (nb) [sol[e] - 1, sol[e], sol[e] + 1].forEach(w => { if (w >= 1 && w <= N) out.add(w); });
          out.delete(v);
          return { n: sol[e], rel: nb && sameRing(e) ? 'both' : nb ? 'nb' : 'ring', out: [...out].sort((a, b) => a - b) };
        });
    say('hintMsg', { v, kind: h.kind, parts }, 'tip');
  }
  function clearHint() {
    if (st.glow === null && !st.why.size) return false;
    st.glow = null; st.why = new Set(); return true;
  }
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#board') || e.target.closest('#hintbtn')) return;   // the board and the hint button handle it themselves
    if (clearHint() && st.p && !over()) draw();
  });
  function tap(id) {
    if (over()) return;
    const wasShowing = st.glow === id;
    clearHint();
    if (st.hinted[id]) { if (wasShowing) { draw(); say('filled'); } else showHint(id); return; }
    st.sel = st.sel === id ? null : id; draw();
    if (st.sel === null) return;
    if (st.p.giv.includes(id) || st.val[id] !== undefined) say('filled');
    else say(st.noteMode ? 'noteMode' : 'pick');
  }
  svg.addEventListener('click', e => { const g = e.target.closest('.pc'); if (g) tap(+g.dataset.id); });
  svg.addEventListener('keydown', e => {
    const g = e.target.closest && e.target.closest('.pc'); if (!g) return;
    const id = +g.dataset.id;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(id); }
    else if (/^[1-8]$/.test(e.key)) { st.sel = id; enter(+e.key); }
    else if (e.key === 'Backspace' || e.key === 'Delete') { st.sel = id; enter(0); }
    else return;
    const f = svg.querySelector(`[data-id="${id}"]`); if (f) f.focus({ preventScroll: true });
  });

  // When a number is placed, tidy the notes it rules out (same ring; equal or consecutive neighbours).
  function tidyNotes(id, v) {
    delete st.notes[id];
    const k = Math.floor(id / N);
    for (let i = 0; i < N; i++) { const d = cid(k, i); if (st.notes[d]) st.notes[d].delete(v); }
    for (const d of NB[id]) if (st.notes[d]) { st.notes[d].delete(v - 1); st.notes[d].delete(v); st.notes[d].delete(v + 1); }
  }
  function place(id, v) {
    st.val[id] = v; tidyNotes(id, v);
    if (Object.keys(st.val).length === C - st.p.giv.length) { end('win', true); return true; }
    return false;
  }
  function enter(n) {
    if (over()) return;
    if (st.sel === null) { say('selectFirst', null, 'bad'); return; }
    const id = st.sel;
    if (st.p.giv.includes(id) || st.val[id] !== undefined) { say('filled'); return; }
    if (st.wrong && st.wrong.id === id) st.wrong = null;   // any new action on the cell clears the red mistake
    if (n === 0) { delete st.notes[id]; draw(); save(); return; }
    if (ringUsed(id).has(n)) { say('inRing'); return; }   // keyboard entry of a greyed-out number
    if (st.noteMode) { const s = st.notes[id] || new Set(); s.has(n) ? s.delete(n) : s.add(n); st.notes[id] = s; draw(); save(); return; }
    if (n === st.p.sol[id]) {
      st.sel = null;
      if (!place(id, n)) { draw(); save(); say('good'); }
      return;
    }
    st.mistakes++;
    st.wrong = { id, n };   // stays in red until the player changes that piece
    if (st.mistakes >= LIVES()) { end('lose', true); say('lostMsg', null, 'bad'); return; }
    draw(); save();
    say('wrongNum', LIVES() - st.mistakes, 'bad');
  }
  const pad = $('pad');
  [1, 2, 3, 4, 5, 6, 7, 8].forEach(n => { const b = document.createElement('button'); b.textContent = n; b.addEventListener('click', () => enter(n)); pad.appendChild(b); });
  const del = document.createElement('button'); del.id = 'del'; del.style.fontFamily = 'var(--body)'; del.style.fontSize = '13px'; del.style.lineHeight = '1.2';
  del.addEventListener('click', () => enter(0)); pad.appendChild(del);

  $('hintbtn').addEventListener('click', () => {
    if (over()) return;
    if (st.hints >= MAX_HINTS) { say('noHints', null, 'bad'); return; }
    const h = AN.hint(st.p.sol, known());
    if (!h) return;
    st.hints++; st.sel = null;
    if (st.wrong && st.wrong.id === h.cell) st.wrong = null;
    st.hinted[h.cell] = { kind: h.kind, why: h.why || [] };   // kept so the player can tap it later to see why
    if (place(h.cell, h.value)) return;
    showHint(h.cell); save();
  });

  function toggleLabels() {
    const t = T();
    $('notes').textContent = `${t.notes}: ${st.noteMode ? t.on : t.off}`;
    $('notes').classList.toggle('on', st.noteMode); $('notes').setAttribute('aria-pressed', String(st.noteMode));
  }
  $('notes').addEventListener('click', () => { st.noteMode = !st.noteMode; toggleLabels(); if (st.sel !== null) say(st.noteMode ? 'noteMode' : 'pick'); });
  function selectShare() { const r = document.createRange(); r.selectNodeContents($('shareText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  // Sharing: native share sheet on phones; WhatsApp and X links elsewhere; copy always available.
  const SITE = /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/index\.html$/, '') : 'https://playringoku.github.io/';
  const canNativeShare = !!navigator.share && window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const fullShare = () => $('shareText').textContent + '\n\n' + T().invite(SITE);
  function updateShare() {
    const text = fullShare();
    $('share').hidden = !canNativeShare;
    $('wa').hidden = canNativeShare; $('tw').hidden = canNativeShare;
    $('wa').href = 'https://wa.me/?text=' + encodeURIComponent(text);
    $('tw').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
  }
  $('share').addEventListener('click', () => {
    track('compartir/nativo');
    try { navigator.share({ text: fullShare() }).catch(() => {}); } catch (e) {}
  });
  $('wa').addEventListener('click', () => track('compartir/whatsapp'));
  $('tw').addEventListener('click', () => track('compartir/x'));
  $('copy').addEventListener('click', () => {
    const t = T(), text = fullShare();
    track('compartir/copiar');
    const fallback = () => { selectShare(); $('copied').textContent = t.copyFail; };
    try {
      navigator.clipboard.writeText(text).then(() => { $('copied').textContent = t.copied; setTimeout(() => { $('copied').textContent = ''; }, 2000); }, fallback);
    } catch (e) { fallback(); }
  });

  $('helpbtn').addEventListener('click', () => { const h = $('help'); h.open = !h.open; if (h.open) h.scrollIntoView({ block: 'nearest' }); });
  $('prev').addEventListener('click', () => load(shiftKey(st.key, -1)));
  $('next').addEventListener('click', () => load(shiftKey(st.key, 1)));

  function header() {
    const t = T(), p = st.p, key = st.key;
    const label = new Date(AN.parseKey(key)).toLocaleDateString(t.dateLocale, { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
    $('dtitle').textContent = t.number(p.number);
    $('dsub').textContent = key === TODAY ? t.today + label : label.charAt(0).toUpperCase() + label.slice(1);
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = t[p.level]; $('dsub').append(badge);
  }
  function applyLang() {
    const t = T();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
    $('del').textContent = t.del;
    $('prev').setAttribute('aria-label', t.prev); $('next').setAttribute('aria-label', t.next);
    svg.setAttribute('aria-label', t.board);
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    toggleLabels();
    if (st.p) {
      header();
      if (over()) renderResult();
      const [k, a, kind] = st.msg; say(k, a, kind);
      draw();
    }
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('lang', lang); applyLang();
  }));

  function load(key) {
    if (st.p && !over()) save();
    const p = AN.daily(key);
    const saved = store.get(key) || {};
    const val = {};
    for (const id in (saved.val || {})) if (saved.val[id] === p.sol[id] && !p.giv.includes(+id)) val[id] = saved.val[id];
    const notes = {}; for (const id in (saved.notes || {})) notes[id] = new Set(saved.notes[id]);
    const hinted = {}; for (const id in (saved.hinted || {})) if (val[id] !== undefined) hinted[id] = saved.hinted[id];
    Object.assign(st, { key, p, val, notes, hinted, sel: null, focus: null, wrong: null, glow: null, why: new Set(),
      solved: !!saved.solved, lost: !!saved.lost, firstEnd: false, mistakes: saved.mistakes || 0, hints: saved.hints || 0,
      ms: saved.ms || 0, since: Date.now() });
    header();
    $('prev').disabled = AN.parseKey(key) <= AN.LAUNCH;
    $('next').disabled = key >= TODAY;
    $('result').hidden = true; $('playarea').hidden = false;
    $('timer').textContent = fmt(st.ms);
    say(Object.keys(st.val).length ? 'resume' : 'start');
    if (st.solved) end('win', false);
    else if (st.lost) { end('lose', false); say('lostMsg', null, 'bad'); }
    else draw();
  }

  document.addEventListener('visibilitychange', () => {
    if (over() || !st.p) return;
    if (document.hidden) { st.ms += Date.now() - st.since; save(); } else st.since = Date.now();
  });
  setInterval(() => { if (!over() && st.p) $('timer').textContent = fmt(elapsed()); }, 1000);

  // Tabs left open on a phone: when the date changes, move to the new puzzle
  // (straight away if the old one is finished or untouched; otherwise let the player finish and tell them).
  function checkNewDay() {
    const now = AN.keyOf(new Date());
    if (now === TODAY || !st.p) return;
    const wasToday = st.key === TODAY;
    TODAY = now;
    retention();
    const untouched = !Object.keys(st.val).length && !Object.keys(st.notes).length && !st.mistakes && !st.hints;
    if (wasToday && (over() || untouched)) { load(TODAY); say('newDay', null, 'tip'); return; }
    header(); $('next').disabled = st.key >= TODAY;
    if (wasToday) say('newAvail', null, 'tip');
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
  window.addEventListener('focus', checkNewDay);
  window.addEventListener('pageshow', checkNewDay);
  setInterval(checkNewDay, 30000);

  // Retención anónima: sin cookies ni identificadores. El navegador solo guarda en qué días se abrió el puzzle
  // y avisa a GoatCounter una vez por hito: jugador nuevo, vuelve al día siguiente, y su 2.º, 3.º, 7.º, 14.º y 30.º día distinto.
  // Retención = retencion/dias-2 ÷ retencion/nuevo (y así con cada hito).
  function sendEvent(path, tries = 0) {
    if (window.goatcounter && window.goatcounter.count) { track(path); return; }
    if (tries < 20) setTimeout(() => sendEvent(path, tries + 1), 500);   // count.js se carga en async
  }
  function retention() {
    let days = store.get('days');
    if (!days) {   // primera vez con este código: recupera los días ya jugados antes, para no contar a los antiguos como nuevos
      days = [];
      for (let k = shiftKey(TODAY, -1); AN.parseKey(k) >= AN.LAUNCH; k = shiftKey(k, -1)) if (store.get(k)) days.unshift(k);
      store.set('daysCount', days.length);
      if (days.length) sendEvent('retencion/antiguo');
    }
    if (days.includes(TODAY)) return;
    const last = days[days.length - 1];
    days.push(TODAY); store.set('days', days.slice(-60));
    const n = (store.get('daysCount') || 0) + 1; store.set('daysCount', n);
    if (n === 1) sendEvent('retencion/nuevo');
    if (last === shiftKey(TODAY, -1)) sendEvent('retencion/vuelve-al-dia-siguiente');
    if ([2, 3, 7, 14, 30].includes(n)) sendEvent(`retencion/dias-${n}`);
  }

  $('help').open = !store.get('help');
  store.set('help', 1);
  applyLang();
  load(TODAY);
  retention();
})();
</script>
